name: DJ Time
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  run-sync-service:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Write credentials and token cache
        env:
          CREDENTIALS: ${{ secrets.CREDENTIALS }}
          CACHE: ${{ secrets.CACHE }}
        run: |
          printf '%s' "$CREDENTIALS" > credentials.json
          printf '%s' "$CACHE" > .cache

      - name: DJ Time
        run: uv run main.py
