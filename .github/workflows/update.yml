name: DJ Time
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  run-sync-service:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write credentials and token cache
        env:
          CREDENTIALS: ${{ secrets.CREDENTIALS }}
          CACHE: ${{ secrets.CACHE }}
        run: |
          printf '%s' "$CREDENTIALS" > credentials.json
          printf '%s' "$CACHE" > .cache
          cp .cache "$RUNNER_TEMP/cache.orig"

      - name: DJ Time
        run: python main.py

      # Spotipy rewrites .cache whenever it refreshes the access token. Save it back
      # to the CACHE secret so the stored refresh token never goes stale.
      - name: Persist refreshed Spotify token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ ! -s .cache ] || cmp -s .cache "$RUNNER_TEMP/cache.orig"; then
            echo "Token cache unchanged; nothing to persist."
            exit 0
          fi
          python -c "import json; json.load(open('.cache'))"
          gh secret set CACHE --repo "$GITHUB_REPOSITORY" < .cache
          echo "Updated CACHE secret."
